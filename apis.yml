aid: qudos-bank
url: https://raw.githubusercontent.com/api-evangelist/qudos-bank/refs/heads/main/apis.yml
name: Qudos Bank
kind: company
description: Qudos Bank is an Australian customer-owned (mutual) bank that has been
  100% customer-owned since 1959, serving members with everyday transaction and savings
  accounts, term deposits, credit cards, home and personal loans, and offset accounts.
  Following its 2025 merger it now operates as a division of Bank Australia Limited
  (ABN 21 087 651 607, trading as Qudos Bank), one of the largest customer-owned banks
  in the country. As an Australian authorised deposit-taking institution and a designated
  data holder under the Consumer Data Right (CDR / Open Banking), Qudos Bank exposes
  a public, unauthenticated Product Reference Data (PRD) API conforming to the Data
  Standards Body Consumer Data Standards, and supports authenticated CDR consumer
  data sharing with accredited data recipients under the ACCC / FAPI security profile.
